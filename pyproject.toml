[project]
name = "trader-bot"
version = "0.1.0"
description = "ML-driven Binance USD-M futures trading bot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "catboost",
    "lightgbm",
    "optuna",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "psycopg[binary]",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "typer",
    "structlog",
    "httpx",
    "websockets",
    "tenacity",
    "binance-sdk-derivatives-trading-usds-futures",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
trader-bot = "trader_bot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
