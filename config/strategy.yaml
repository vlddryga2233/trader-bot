symbols: [BTCUSDT, ETHUSDT]
decision_interval: 4h
history_start: "2016-01-01"

features:
  groups:
    price: true
    derivatives: true
    liquidations: false   # keep off unless same-data CV and backtest show an improvement
    onchain: false        # needs Glassnode / CryptoQuant key
    cross_asset: false    # reference-symbol returns/volatility (BTC for ETH, ETH for BTC)
    calendar: false       # decision hour and weekday
    derivs_extra: false   # funding z-score, OI-price divergence, stationary OI/long-short
  onchain_publication_lag_hours: 24

labeling:
  horizon_candles: 6      # 6 x 4h = 24h
  flat_atr_mult: 1.0      # |fwd return| below k * atr_pct * sqrt(horizon) => flat

model:
  confidence_threshold: 0.75
  class_balance: false    # `trader-bot experiment` compares balanced vs unweighted classifiers
  promotion_min_balanced_accuracy: 0.38  # minimum purged-CV macro recall
  promotion_min_signal_precision: 0.40  # after confidence and return-sign agreement filters
  promotion_min_signal_coverage: 0.005  # share of OOS rows that produce an eligible signal
  embargo_candles: 6
  cv_splits: 5
  min_train_candles: 1500
  retrain_every_candles: 540   # backtest walk-forward retrain cadence (540 x 4h = 90 days); live retrains every 7 days
  optuna_trials: 30

risk:                       # values are clamped to hard maximums in risk/limits.py
  risk_per_trade: 0.01
  leverage: 3
  atr_stop_mult: 2.0
  min_reward_risk: 1.5
  max_open_positions: 2
  daily_loss_limit: 0.03
  weekly_loss_limit: 0.07

backtest:
  taker_fee: 0.0005
  slippage_bps: 2.0
  initial_equity: 10000
  start: "2023-10-01"      # ~3 years of out-of-sample trading

signal_mode: classic        # "barrier" = triple-barrier labels + expected-value signal (research)
barrier:
  tp_atr_mult: 3.0          # take-profit distance in ATR; must be >= atr_stop_mult * min_reward_risk
  min_ev_r: 0.05            # trade only if expected value after costs >= this many R
  calib_frac: 0.2           # most recent share of each training window used for calibration
  promotion_min_signals: 30
  promotion_min_mean_r: 0.05
  model_size: default   # or "small"
